name: macos-app

# The nix pipeline never opens app/EXO: Xcode is the only thing that compiles it,
# so a Swift change reaches a release build unchecked. This job compiles the app
# and the unit tests, then runs the unit tests.
#
# Signing is ad-hoc (identity "-"), which needs no certificate and no team while
# still attaching EXO.entitlements. The UI tests are excluded: they drive the real
# app, which has no business launching on a runner.
#
# Two settings exist only to make the build possible without the release pipeline:
# Copy Bundle Resources pulls in dist/exo, the PyInstaller runtime that build-app.yml
# produces before it calls xcodebuild, so an empty directory stands in for it here;
# and ENABLE_DEBUG_DYLIB=NO drops the SwiftUI preview dylib, whose link step failed
# here and which nothing on a runner previews.

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test the macOS app
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app/EXO
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Record the toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Stand in for the PyInstaller runtime
        run: mkdir -p ../../dist/exo && touch ../../dist/exo/placeholder

      - name: Build the app and the tests
        run: |
          xcodebuild build-for-testing \
            -scheme EXO \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            ENABLE_DEBUG_DYLIB=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES

      - name: Run the unit tests
        run: |
          xcodebuild test-without-building \
            -scheme EXO \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build \
            -only-testing:EXOTests
