<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="The event cycle. A component proposes an event through the EventRouter, which stamps it and publishes it on the local_events topic. The master sequencer assigns a global index, applies it to its own state and appends it to a disk log, then rebroadcasts on global_events. Every node's ordered buffer fans it to a Worker and API state replica, and the Worker's plan function turns state back into new proposals.">
<title>The event cycle. A component proposes an event through the EventRouter, which stamps it and publishes it on the local_events topic. The master sequencer assigns a global index, applies it to its own state and appends it to a disk log, then rebroadcasts on global_events. Every node's ordered buffer fans it to a Worker and API state replica, and the Worker's plan function turns state back into new proposals.</title>
<style>
  :root{
    --surface:#FFFFFF; --surface-2:#EEF0F7; --ink:#14161C; --ink-2:#3A4052;
    --muted:#666E85; --rule-2:#C3C9DA;
    --ctl:#3F51C4; --ten:#B84A18; --wts:#1B7565; --warn:#9A2F2F;
    --ctl-wash:#E7EAFA; --ten-wash:#FBEAE1; --wts-wash:#E1F1ED; --warn-wash:#F8E8E8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --surface:#171A22; --surface-2:#1F2330; --ink:#E8EAF1; --ink-2:#C2C7D6;
      --muted:#959CB0; --rule-2:#3A4152;
      --ctl:#8D9AF2; --ten:#F0864F; --wts:#4FC3AA; --warn:#EE8A8A;
      --ctl-wash:#1C2140; --ten-wash:#332014; --wts-wash:#132C28; --warn-wash:#331A1A;
    }
  }
  .s-box{fill:var(--surface); stroke:var(--rule-2); stroke-width:1.3}
  .s-box2{fill:var(--surface-2); stroke:var(--rule-2); stroke-width:1.3}
  .s-ctl{fill:var(--ctl-wash); stroke:var(--ctl); stroke-width:1.3}
  .s-ten{fill:var(--ten-wash); stroke:var(--ten); stroke-width:1.3}
  .s-wts{fill:var(--wts-wash); stroke:var(--wts); stroke-width:1.3}
  .s-warn{fill:var(--warn-wash); stroke:var(--warn); stroke-width:1.3}
  .ln{stroke:var(--rule-2); stroke-width:1.3; fill:none}
  .ln-ctl{stroke:var(--ctl); stroke-width:1.6; fill:none}
  .ln-ten{stroke:var(--ten); stroke-width:1.6; fill:none}
  .ln-wts{stroke:var(--wts); stroke-width:1.6; fill:none}
  .dash{stroke-dasharray:5 4}
  .t{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; fill:var(--ink-2)}
  .t-s{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:9.5px; fill:var(--muted)}
  .t-b{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:12.5px; font-weight:600; fill:var(--ink)}
  .t-h{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:13.5px; font-weight:700; fill:var(--ink)}
  .t-ctl{fill:var(--ctl)} .t-ten{fill:var(--ten)} .t-wts{fill:var(--wts)} .t-warn{fill:var(--warn)}
  .m-ctl{fill:var(--ctl)} .m-ten{fill:var(--ten)} .m-wts{fill:var(--wts)} .m-n{fill:var(--rule-2)}
</style>
<defs>
  <marker id="a-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-n"/></marker>
  <marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-ctl"/></marker>
  <marker id="a-ten" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-ten"/></marker>
  <marker id="a-wts" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-wts"/></marker>
</defs>

        <!-- top row -->
        <rect class="s-box" x="30" y="40" width="176" height="56" rx="3"/>
        <text class="t-b" x="118" y="62" text-anchor="middle">any component</text>
        <text class="t-s" x="118" y="80" text-anchor="middle">Worker · API · Master · runner</text>
        <path class="ln-ctl" d="M206 68 H244" marker-end="url(#a-ctl)"/>
        <rect class="s-ctl" x="246" y="40" width="212" height="56" rx="3"/>
        <text class="t-b" x="352" y="62" text-anchor="middle">EventRouter.sender</text>
        <text class="t-s" x="352" y="80" text-anchor="middle">stamps SystemId · origin_idx · SessionId</text>
        <path class="ln-ctl" d="M458 68 H494" marker-end="url(#a-ctl)"/>
        <rect class="s-ctl" x="496" y="48" width="146" height="40" rx="20"/>
        <text class="t" x="569" y="72" text-anchor="middle">local_events</text>
        <path class="ln-ctl" d="M642 68 H682" marker-end="url(#a-ctl)"/>

        <rect class="s-ctl" x="684" y="30" width="240" height="110" rx="3"/>
        <text class="t-b" x="804" y="54" text-anchor="middle">Master — the sequencer</text>
        <text class="t-s" x="700" y="76">1. drop foreign sessions, resequence per source</text>
        <text class="t-s" x="700" y="93">2. idx = len(event_log)</text>
        <text class="t-s" x="700" y="110">3. apply() → its own State</text>
        <text class="t-s" x="700" y="127">4. append to the on-disk log</text>

        <path class="ln-ctl" d="M804 140 V178" marker-end="url(#a-ctl)"/>
        <rect class="s-ctl" x="731" y="180" width="146" height="40" rx="20"/>
        <text class="t" x="804" y="204" text-anchor="middle">global_events</text>
        <path class="ln-ctl" d="M731 200 H676" marker-end="url(#a-ctl)"/>
        <rect class="s-ctl" x="430" y="176" width="244" height="48" rx="3"/>
        <text class="t-b" x="552" y="196" text-anchor="middle">OrderedBuffer — every node</text>
        <text class="t-s" x="552" y="213" text-anchor="middle">releases only a contiguous prefix</text>

        <!-- nack back edge -->
        <path class="ln-ten dash" d="M430 200 H396 V150 H684" marker-end="url(#a-ten)"/>
        <text class="t-s t-ten" x="404" y="130">nack: RequestEventLog</text>
        <text class="t-s t-ten" x="404" y="143">0.5 s → 10 s backoff · master replays ≤ 1000</text>

        <!-- replicas -->
        <path class="ln-ctl" d="M500 224 V276" marker-end="url(#a-ctl)"/>
        <path class="ln-ctl" d="M610 224 V276" marker-end="url(#a-ctl)"/>
        <rect class="s-box" x="378" y="278" width="180" height="50" rx="3"/>
        <text class="t-b" x="468" y="299" text-anchor="middle">Worker State</text>
        <text class="t-s" x="468" y="316" text-anchor="middle">replica 2 of 3</text>
        <rect class="s-box" x="580" y="278" width="180" height="50" rx="3"/>
        <text class="t-b" x="670" y="299" text-anchor="middle">API State</text>
        <text class="t-s" x="670" y="316" text-anchor="middle">replica 3 of 3 — serves /state</text>

        <!-- plan loop -->
        <path class="ln-ctl" d="M378 303 H310" marker-end="url(#a-ctl)"/>
        <rect class="s-ctl" x="108" y="278" width="200" height="50" rx="3"/>
        <text class="t-b" x="208" y="299" text-anchor="middle">plan()</text>
        <text class="t-s" x="208" y="316" text-anchor="middle">pure · ≤ 1 Task per 100 ms tick</text>
        <path class="ln-ctl" d="M118 278 V96" marker-end="url(#a-ctl)"/>
        <text class="t-s t-ctl" x="20" y="200">the convergence</text>
        <text class="t-s t-ctl" x="20" y="214">loop: state in,</text>
        <text class="t-s t-ctl" x="20" y="228">events out</text>

        <text class="t-s" x="30" y="380">The master publishes its own decisions to itself. A command handler's output is not in State until it has gone</text>
        <text class="t-s" x="30" y="396">out on local_events and come back through the sequencer — which is why back-to-back commands can be</text>
        <text class="t-s" x="30" y="412">planned against stale state.</text>
      
</svg>
